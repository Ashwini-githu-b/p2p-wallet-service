services:
  - type: web
    name: wallet-service
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_POOL_SIZE
        value: "8"
      - key: WALLET_TRANSFER_STRATEGY
        value: ORDERED_LOCKS

