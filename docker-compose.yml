services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - app
volumes:
  pgdata:

