services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
      WALLET_TRANSFER_STRATEGY: ${WALLET_TRANSFER_STRATEGY:-ORDERED_LOCKS}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - app
  k6:
    image: grafana/k6:latest
    profiles: ["bench"]
    volumes:
      - ./bench:/bench:ro
      - ./bench/results:/bench/results:rw
    working_dir: /bench
    environment:
      BASE_URL: http://app:8080
      SCENARIO: ${SCENARIO:-uniform}
      USERS: ${USERS:-200}
      VUS: ${VUS:-50}
      DURATION: ${DURATION:-30s}
      WARMUP: ${WARMUP:-10s}
    depends_on:
      - app
    # entrypoint is overridden per-run via `docker compose run`
    entrypoint: ["k6"]
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: ["observability"]
    ports: ["3001:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
volumes:
  pgdata:

